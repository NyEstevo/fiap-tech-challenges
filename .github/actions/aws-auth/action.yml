name: aws-auth
description: >
  Autentica na AWS conforme o ambiente. lab (AWS Academy) usa chaves estaticas
  de sessao guardadas como GitHub Secrets; prod usa OIDC (sem credenciais de
  longa duracao). Composite action -- os passos de credencial rodam no MESMO job
  que precisa delas (um reusable workflow nao propagaria as credenciais entre
  jobs).

inputs:
  environment:
    description: 'lab | prod'
    required: true
  aws-region:
    description: regiao AWS
    required: true
  # --- lab: repassados pelo caller a partir de secrets.* ---
  aws-access-key-id:
    description: (lab) AWS_ACCESS_KEY_ID de sessao
    required: false
    default: ""
  aws-secret-access-key:
    description: (lab) AWS_SECRET_ACCESS_KEY de sessao
    required: false
    default: ""
  aws-session-token:
    description: (lab) AWS_SESSION_TOKEN de sessao
    required: false
    default: ""
  # --- prod: OIDC ---
  role-to-assume:
    description: (prod) ARN da role assumida via OIDC
    required: false
    default: ""

runs:
  using: composite
  steps:
    # ---- lab: chaves estaticas de sessao (AWS Academy, expiram ~4h) ----
    - name: configure aws (lab / static session keys)
      if: inputs.environment == 'lab'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-session-token: ${{ inputs.aws-session-token }}
        aws-region: ${{ inputs.aws-region }}

    # ---- prod: OIDC, sem secrets de credencial ----
    - name: configure aws (prod / OIDC)
      if: inputs.environment == 'prod'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        role-session-name: GitHubActions-${{ github.run_id }}
        aws-region: ${{ inputs.aws-region }}

    - name: quem sou eu
      shell: bash
      run: aws sts get-caller-identity >> "$GITHUB_STEP_SUMMARY"
