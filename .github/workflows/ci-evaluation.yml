name: CI - evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "fase-2/evaluation-service/**"
      - ".github/workflows/ci-evaluation.yml"
      - ".github/workflows/_reusable-ci-service.yml"
      - ".github/actions/aws-auth/**"
  push:
    branches: [main, lab, lab-jeff]
    paths:
      - "fase-2/evaluation-service/**"
      - ".github/workflows/ci-evaluation.yml"
      - ".github/workflows/_reusable-ci-service.yml"
      - ".github/actions/aws-auth/**"
    tags:
      - "evaluation/v*"
  release:
    types: [published]

permissions:
  contents: write   # job gitops-update commita o bump na branch lab
  id-token: write   # OIDC no push para main (prod)

jobs:
  ci:
    uses: ./.github/workflows/_reusable-ci-service.yml
    with:
      service_name: evaluation
      service_language: go
      working_directory: fase-2/evaluation-service
      has_migrate_image: false
    secrets: inherit
