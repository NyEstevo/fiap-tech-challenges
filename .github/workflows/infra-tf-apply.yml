name: infra-tf-apply

on:
  push:
    branches: [ main, lab ]
    paths:
      - "fase-3/infra/terraform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: ambiente alvo
        type: choice
        options: [ lab, prod ]
        default: lab

permissions:
  contents: read
  actions: read

concurrency:
  group: infra-tf-apply-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.8"

jobs:
  # branch == ambiente: push na lab -> envs/lab, push na main -> envs/prod.
  # workflow_dispatch usa o input escolhido.
  #
  # lab aplica direto ao mergear. main so aplica depois do gate 'verify-lab'
  # (mesmo terraform/** com apply de sucesso na lab) + aprovacao manual do
  # GitHub Environment 'prod'.
  #
  # Guard: prod so e aplicado quando o bootstrap/prod ja existe -- sinalizado
  # por vars.PROD_AWS_ROLE_ARN. Sem isso, o job 'apply' e pulado, entao um
  # push na main tocando terraform/** nao quebra enquanto prod for so codigo.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
      should_apply: ${{ steps.pick.outputs.should_apply }}
    steps:
      - id: pick
        env:
          PROD_ROLE_ARN: ${{ vars.PROD_AWS_ROLE_ARN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            env="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            env="prod"
          else
            env="lab"
          fi
          echo "environment=$env" >> "$GITHUB_OUTPUT"

          if [ "$env" = "prod" ] && [ -z "$PROD_ROLE_ARN" ]; then
            echo "should_apply=false" >> "$GITHUB_OUTPUT"
            {
              echo "### infra-tf-apply — pulado"
              echo ""
              echo "Alvo \`prod\`, mas \`vars.PROD_AWS_ROLE_ARN\` está vazio: o"
              echo "ambiente prod ainda é só código. Rode \`fase-3/infra/bootstrap/prod\`"
              echo "e configure a variável para habilitar. Nenhum apply executado."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_apply=true" >> "$GITHUB_OUTPUT"
          fi

  # Gate de promocao: push na lab aplica direto; push na main so aplica
  # depois que o MESMO fase-3/infra/terraform ja rodou com sucesso na
  # branch lab. Para lab (env != prod) este job e pulado.
  verify-lab:
    needs: resolve
    if: needs.resolve.outputs.should_apply == 'true' && needs.resolve.outputs.environment == 'prod'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: terraform/** ja aplicado com sucesso no lab?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # historia completa da lab para resolver os SHAs dos runs
          git fetch --no-tags origin '+refs/heads/lab:refs/remotes/origin/lab'

          want="$(git rev-parse "HEAD:fase-3/infra/terraform")"
          echo "tree de fase-3/infra/terraform em ${{ github.sha }}: $want"

          mapfile -t shas < <(gh run list \
            --workflow infra-tf-apply.yml \
            --branch lab \
            --status success \
            --limit 30 \
            --json headSha --jq '.[].headSha')

          if [ "${#shas[@]}" -eq 0 ]; then
            echo "::error::Nenhum run de sucesso do infra-tf-apply na branch lab."
            exit 1
          fi

          for sha in "${shas[@]}"; do
            got="$(git rev-parse "$sha:fase-3/infra/terraform" 2>/dev/null || true)"
            if [ "$got" = "$want" ]; then
              echo "OK: lab aplicou este mesmo terraform/** em $sha"
              {
                echo "### infra-tf-apply — gate de lab"
                echo ""
                echo "\`fase-3/infra/terraform\` idêntico ao aplicado com sucesso no lab (\`$sha\`)."
                echo "Segue para aprovação manual do ambiente \`prod\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done

          {
            echo "### infra-tf-apply — bloqueado"
            echo ""
            echo "\`fase-3/infra/terraform\` em \`main\` não corresponde a nenhum apply"
            echo "de sucesso na branch \`lab\` (últimos 30 runs)."
            echo ""
            echo "Faça merge na \`lab\` e deixe o \`infra-tf-apply\` concluir antes de promover para \`prod\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::terraform/** nao validado no lab."
          exit 1

  apply:
    needs: [ resolve, verify-lab ]
    # verify-lab e pulado no fluxo da lab -> 'skipped' tambem libera.
    if: >-
      always() &&
      needs.resolve.outputs.should_apply == 'true' &&
      (needs.verify-lab.result == 'success' || needs.verify-lab.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC no prod
      contents: read
    # GitHub Environment: 'prod' com Required reviewers -> aprovacao manual antes do apply na main
    environment: ${{ needs.resolve.outputs.environment }}
    defaults:
      run:
        working-directory: fase-3/infra/terraform/envs/${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      # lab -> chaves estaticas de sessao (Academy); prod -> OIDC.
      - name: auth AWS
        uses: ./.github/actions/aws-auth
        with:
          environment: ${{ needs.resolve.outputs.environment }}
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ vars.PROD_AWS_ROLE_ARN }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # necessario para o null_resource.root_app (kubectl apply do app-of-apps)
      - uses: azure/setup-kubectl@v4

      # ---- gates estaticos antes de tocar a AWS (mesmo do infra-tf-plan) ----
      - name: terraform fmt
        working-directory: fase-3/infra/terraform
        run: terraform fmt -check -recursive

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: fase-3/infra/terraform
          config_file: fase-3/infra/terraform/.checkov.yaml

      - name: trivy config (IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: fase-3/infra/terraform
          trivyignores: fase-3/infra/terraform/.trivyignore
          severity: CRITICAL
          exit-code: "1"
          format: table

      - name: terraform init
        run: terraform init -input=false

      # No primeiro apply de um ambiente vazio, descomente para encenar os providers:
      # - name: terraform apply (bootstrap networking + eks)
      #   run: terraform apply -input=false -auto-approve -lock-timeout=300s -target=module.networking -target=module.eks

      - name: terraform plan
        run: terraform plan -input=false -lock-timeout=300s -no-color -out=tfplan

      - name: terraform apply
        run: terraform apply -input=false -lock-timeout=300s tfplan

      - name: outputs -> step summary
        run: |
          {
            echo "## Terraform outputs — ${{ needs.resolve.outputs.environment }}"
            echo ''
            echo '```json'
            terraform output -json | jq 'map_values(if .sensitive then "<sensitive>" else .value end)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
