name: infra-tf-plan

on:
  pull_request:
    paths:
      - "fase-3/infra/terraform/**"
      - ".github/workflows/infra-tf-*.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: infra-tf-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.9.8"
  TF_ROOT: fase-3/infra/terraform/envs/prod

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC no prod
      contents: read
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (AWS Academy static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.PROD_AWS_ROLE_ARN }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        working-directory: fase-3/infra/terraform
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        working-directory: fase-3/infra/terraform
        run: |
          tflint --init
          tflint --recursive -f compact

      # IaC scan BLOQUEANTE. checkov usa .checkov.yaml (soft-fail: false +
      # baseline de skips justificados p/ AWS Academy). trivy config barra
      # misconfig CRITICA.
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: fase-3/infra/terraform
          config_file: fase-3/infra/terraform/.checkov.yaml

      - name: trivy config (IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: fase-3/infra/terraform
          trivyignores: fase-3/infra/terraform/.trivyignore
          severity: CRITICAL
          exit-code: "1"
          format: table

      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=120s -out=tfplan | tee plan.txt
          {
            echo 'stdout<<TFPLAN_EOF'
            tail -c 60000 plan.txt
            echo 'TFPLAN_EOF'
          } >> "$GITHUB_OUTPUT"

