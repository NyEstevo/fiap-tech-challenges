minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: ^fase-3/gitops/manifests/  # kustomize/ArgoCD: usar kustomize build

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
        files: ^fase-3/infra/
      - id: terraform_validate
        args: ["--tf-init-args=-backend=false"]
        files: ^fase-3/infra/
      - id: terraform_tflint
        args:
          - "--args=--config=__GIT_WORKING_DIR__/fase-3/infra/terraform/.tflint.hcl"
        files: ^fase-3/infra/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
