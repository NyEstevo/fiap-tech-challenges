# Lint/format dos servicos Python (flag, targeting, analytics).
# Gate bloqueante no CI (_reusable-ci-service.yml -> job 'lint').
target-version = "py312"
line-length = 100

[lint]
# E/W  pycodestyle   | F  pyflakes (bugs reais)   | I  isort
# B    flake8-bugbear| UP pyupgrade               | C4 comprehensions
select = ["E", "W", "F", "I", "B", "UP", "C4"]
# E501: o formatter cuida do comprimento; nao falhar lint por 1-2 chars.
ignore = ["E501"]

[format]
quote-style = "double"
