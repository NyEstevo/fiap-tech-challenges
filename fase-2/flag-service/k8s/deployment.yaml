apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-deployment
  namespace: flag
  labels:
    app: flag
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flag
  template:
    metadata:
      labels:
        app: flag
    spec:
      containers:
      - name: flag-container
        image: 047719652987.dkr.ecr.us-east-2.amazonaws.com/tech-challenge/flag-image:latest
        resources:
          requests:
            memory: "64Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "40m"
        ports:
        - containerPort: 8002
        envFrom:
        - configMapRef:
            name: flag-configmap
        - secretRef:
            name: flag-secret
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 10