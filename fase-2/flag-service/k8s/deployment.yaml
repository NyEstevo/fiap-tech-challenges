apiVersion: apps/v1
kind: Deployment
metadata:
  name: flags-service-deployment
  namespace: tech-challenge-fase-2
  labels:
    app: flags-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flags-service
  template:
    metadata:
      labels:
        app: flags-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: flags-service
          image: 506394430088.dkr.ecr.us-east-1.amazonaws.com/fiap-tech-challenge/fase-2:flags-service-v1.4
          ports:
            - containerPort: 8002
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flags-service-secret
                  key: DATABASE_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: flags-service-config
                  key: AUTH_SERVICE_URL
          
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m" 