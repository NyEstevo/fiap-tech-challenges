apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ambiente local (Kind/Minikube, up.sh). Sobe a aplicacao a partir da imagem
# que a base ja declara -- ECR antigo :1.0 -- ou de um build local trocado com
# 'kustomize edit set image tech-challenge/analytics-image=analytics:dev'.
# Sem ESO, sem credencial de sessao AWS, sem ajustes de KEDA/replicas: isso e do lab.
resources:
- ../../base

namespace: toggle

images:
- name: 047719652987.dkr.ecr.us-east-2.amazonaws.com/tech-challenge/analytics-image
  newTag: "1.0"

- patch: |
    - op: replace
      path: /spec/minReplicaCount
      value: 1
  target:
    kind: ScaledObject
    name: analytics-service-scaler
- patch: |
    - op: remove
      path: /spec/podIdentity
    - op: add
      path: /spec/secretTargetRef
      value:
        - parameter: awsAccessKeyID
          name: aws-session-creds
          key: AWS_ACCESS_KEY_ID
        - parameter: awsSecretAccessKey
          name: aws-session-creds
          key: AWS_SECRET_ACCESS_KEY
        - parameter: awsSessionToken
          name: aws-session-creds
          key: AWS_SESSION_TOKEN
  target:
    group: keda.sh
    kind: TriggerAuthentication
    name: keda-aws-credentials
    version: v1alpha1
- patch: |
    - op: replace
      path: /spec/triggers/0/metadata/queueURL
      value: https://sqs.us-east-1.amazonaws.com/047719652987/tc-sqs
    - op: replace
      path: /spec/triggers/0/metadata/awsRegion
      value: us-east-1
    - op: remove
      path: /spec/triggers/0/metadata/identityOwner
  target:
    group: keda.sh
    kind: ScaledObject
    name: analytics-service-scaler
    version: v1alpha1
- patch: |
    - op: add
      path: /spec/template/spec/containers/0/envFrom/-
      value:
        secretRef:
          name: analytics-secret
    - op: add
      path: /spec/template/spec/containers/0/envFrom/-
      value:
        secretRef:
          name: aws-session-creds
  target:
    kind: Deployment
    name: analytics-deployment