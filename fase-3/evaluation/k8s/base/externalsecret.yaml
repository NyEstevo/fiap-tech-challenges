apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: evaluation-secret
  namespace: toggle
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: evaluation-secret # mesmo nome que o Deployment referencia em envFrom
    creationPolicy: Owner
  data:
    - secretKey: SERVICE_API_KEY
      remoteRef: { key: tc-evaluation-app, property: SERVICE_API_KEY }
    # config de ambiente (nao-secreta, mas derivada da infra): sai do configmap
    - secretKey: REDIS_URL
      remoteRef: { key: tc-evaluation-app, property: REDIS_URL }
    - secretKey: AWS_SQS_URL
      remoteRef: { key: tc-evaluation-app, property: AWS_SQS_URL }
    - secretKey: AWS_REGION
      remoteRef: { key: tc-evaluation-app, property: AWS_REGION }
