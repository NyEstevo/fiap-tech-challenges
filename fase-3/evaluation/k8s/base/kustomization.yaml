apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base real do evaluation-service, consolidada da fase-2 (Emenda 001 do
# ACCEPTANCE). Conteudo identico a
# fase-2/evaluation-service/k8s/{configmap,deployment,service,hpa}.yaml: a
# migracao nao pode mudar o render. secrets.yaml da fase-2 continua de fora --
# o Secret evaluation-secret e materializado pelo ESO (ver overlay lab).
#
# evaluation-service nao tem banco relacional (so Redis) -> sem Job de migration.
# O hpa.yaml entra na base (min 3 / max 10 da fase-2); o overlay lab ajusta
# para 1..3 via patch. O KEDA e do analytics, nao daqui.
#
# NAO declara 'images:' aqui (invariante 5f): o transformer de imagem e unico e
# vive no overlay de cada ambiente. A chave logica
# 047719652987.dkr.ecr.us-east-2.amazonaws.com/tech-challenge/evaluation-image:1.0
# no deployment.yaml e identificador, nao endereco -- cada overlay a reescreve.
resources:
- configmap.yaml
- deployment.yaml
- service.yaml
- hpa.yaml
