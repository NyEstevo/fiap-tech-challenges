apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base real do flags-service, consolidada da fase-2 (Emenda 001 do ACCEPTANCE).
# Conteudo identico a fase-2/flags-service/k8s/{configmap,deployment,service}.yaml:
# a migracao nao pode mudar o render. secrets.yaml da fase-2 continua de fora --
# o Secret flags-secret e materializado pelo ESO (ver overlay lab).
#
# NAO declara 'images:' aqui (invariante 5f): o transformer de imagem e unico e
# vive no overlay de cada ambiente. A chave logica
# 047719652987.dkr.ecr.us-east-2.amazonaws.com/tech-challenge/flags-image:1.0 no
# deployment.yaml e identificador, nao endereco -- cada overlay a reescreve.
resources:
- configmap.yaml
- deployment.yaml
- externalsecret.yaml
- service.yaml
