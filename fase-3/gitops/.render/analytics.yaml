apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::047719652987:role/tc-eks-dynamo-prod-irsa
  name: analytics-service-account
  namespace: toggle
---
apiVersion: v1
data:
  PORT: "8005"
kind: ConfigMap
metadata:
  name: analytics-configmap
  namespace: toggle
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: toggle
spec:
  ports:
    - port: 8005
      protocol: TCP
      targetPort: 8005
  selector:
    app: analytics
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: analytics
  name: analytics-deployment
  namespace: toggle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: analytics-configmap
            - secretRef:
                name: analytics-secret
          image: 047719652987.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/analytics-image:0.0.0-lab.35-9ece630
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8005
            periodSeconds: 20
            timeoutSeconds: 5
          name: analytics-container
          ports:
            - containerPort: 8005
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /health
              port: 8005
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 8
          resources:
            limits:
              cpu: 500m
              memory: 192Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: 8005
            periodSeconds: 5
      serviceAccountName: analytics-service-account
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: analytics-secret
  namespace: toggle
spec:
  data:
    - remoteRef:
        key: tc-analytics-app-prod
        property: AWS_SQS_URL
      secretKey: AWS_SQS_URL
    - remoteRef:
        key: tc-analytics-app-prod
        property: AWS_DYNAMODB_TABLE
      secretKey: AWS_DYNAMODB_TABLE
    - remoteRef:
        key: tc-analytics-app-prod
        property: AWS_REGION
      secretKey: AWS_REGION
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    creationPolicy: Owner
    name: analytics-secret
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: analytics-service-scaler
  namespace: toggle
spec:
  cooldownPeriod: 300
  maxReplicaCount: 10
  minReplicaCount: 1
  scaleTargetRef:
    name: analytics-deployment
  triggers:
    - authenticationRef:
        name: keda-aws-credentials
      metadata:
        awsRegion: us-east-1
        queueLength: "5"
        queueURL: https://sqs.us-east-1.amazonaws.com/047719652987/tc-sqs-prod
      type: aws-sqs-queue
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-credentials
  namespace: toggle
spec:
  podIdentity:
    provider: aws
