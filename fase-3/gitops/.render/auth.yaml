apiVersion: v1
data:
  CHAOS_ENABLED: "true"
  PORT: "8001"
kind: ConfigMap
metadata:
  name: auth-configmap
  namespace: toggle
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: toggle
spec:
  ports:
    - port: 8001
      protocol: TCP
      targetPort: 8001
  selector:
    app: auth
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: auth
  name: auth-deployment
  namespace: toggle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: APP_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
            - name: OTEL_SERVICE_NAME
              value: $(APP_NAME)-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(HOST_IP):4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=toggle-master,k8s.pod.ip=$(POD_IP)
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: http
            - name: OTEL_PYTHON_EXCLUDED_URLS
              value: /health
          envFrom:
            - configMapRef:
                name: auth-configmap
            - secretRef:
                name: auth-secret
          image: 238903440658.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/auth-image:0.0.0-lab.40-598f63a
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 20
            timeoutSeconds: 5
          name: auth-container
          ports:
            - containerPort: 8001
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 8
          resources:
            limits:
              cpu: 500m
              memory: 192Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 5
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: auth-migrate-598f63a
  namespace: toggle
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: auth
        job: migrate
    spec:
      containers:
        - args:
            - -path=/migrations
            - -database=$(DATABASE_URL)
            - up
          envFrom:
            - secretRef:
                name: auth-secret
          image: 238903440658.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/auth-migrate-image:0.0.0-lab.40-598f63a
          name: migrate
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
      initContainers:
        - command:
            - sh
            - -c
            - |
              until pg_isready -d "$DATABASE_URL"; do
                echo "aguardando o banco..."; sleep 2;
              done
          envFrom:
            - secretRef:
                name: auth-secret
          image: postgres:16-alpine
          name: wait-for-db
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: auth-seed-service-key
  namespace: toggle
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: auth
        job: seed
    spec:
      containers:
        - command:
            - sh
            - -c
            - |
              set -eu
              # api_keys.key_hash = SHA-256 hex da chave crua (ver auth key.go)
              HASH=$(printf '%s' "$SERVICE_API_KEY" | sha256sum | cut -d' ' -f1)
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
                "INSERT INTO api_keys (name, key_hash) VALUES ('evaluation-service', '$HASH') ON CONFLICT (key_hash) DO NOTHING;"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: auth-secret
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  key: SERVICE_API_KEY
                  name: evaluation-secret
          image: postgres:16-alpine
          name: seed
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
  ttlSecondsAfterFinished: 300
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: auth-secret
  namespace: toggle
spec:
  data:
    - remoteRef:
        key: tc-rds-auth-credentials
        property: url
      secretKey: DATABASE_URL
    - remoteRef:
        key: tc-auth-app
        property: MASTER_KEY
      secretKey: MASTER_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: auth-secret
