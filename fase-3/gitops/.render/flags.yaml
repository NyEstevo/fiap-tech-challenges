apiVersion: v1
data:
  AUTH_SERVICE_URL: http://auth-service:8001
  PORT: "8002"
kind: ConfigMap
metadata:
  name: flags-configmap
  namespace: toggle
---
apiVersion: v1
kind: Service
metadata:
  name: flags-service
  namespace: toggle
spec:
  ports:
    - port: 8002
      protocol: TCP
      targetPort: 8002
  selector:
    app: flags
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: flags
  name: flags-deployment
  namespace: toggle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flags
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: flags
    spec:
      containers:
        - env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: APP_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
            - name: OTEL_SERVICE_NAME
              value: $(APP_NAME)-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(HOST_IP):4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=toggle-master,k8s.pod.ip=$(POD_IP)
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: http
            - name: OTEL_PYTHON_EXCLUDED_URLS
              value: /health
          envFrom:
            - configMapRef:
                name: flags-configmap
            - secretRef:
                name: flags-secret
          image: 238903440658.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/flags-image:0.0.0-lab.26-05ab229
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 20
            timeoutSeconds: 5
          name: flags-container
          ports:
            - containerPort: 8002
          readinessProbe:
            failureThreshold: 6
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 8
          resources:
            limits:
              cpu: 500m
              memory: 192Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 5
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: flags-migrate-05ab229
  namespace: toggle
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: flags
        job: migrate
    spec:
      containers:
        - command:
            - alembic
            - upgrade
            - head
          envFrom:
            - secretRef:
                name: flags-secret
          image: 238903440658.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/flags-image:0.0.0-lab.26-05ab229
          name: migrate
          resources:
            limits:
              cpu: 50m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          workingDir: /app
      initContainers:
        - command:
            - sh
            - -c
            - |
              until pg_isready -d "$DATABASE_URL"; do
                echo "aguardando o banco..."; sleep 2;
              done
          envFrom:
            - secretRef:
                name: flags-secret
          image: postgres:16-alpine
          name: wait-for-db
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: flags-secret
  namespace: toggle
spec:
  data:
    - remoteRef:
        key: tc-rds-flags-credentials
        property: url
      secretKey: DATABASE_URL
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: flags-secret
