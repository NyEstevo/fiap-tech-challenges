apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reaproveita os manifests da Fase 2 sem duplicar.
# analytics-service nao tem segredo, mas AWS_SQS_URL / AWS_DYNAMODB_TABLE /
# AWS_REGION do configmap da fase-2 apontam para a conta/regiao antiga
# (us-east-2). Esses valores vem do Secrets Manager via analytics-secret
# (externalsecret.yaml), adicionado ao envFrom pelo patch abaixo.
# analytics-service usa SQS + DynamoDB (schemaless) -> sem Job de migration.
resources:
- ../../../../fase-2/analytics-service/k8s/configmap.yaml
- ../../../../fase-2/analytics-service/k8s/deployment.yaml
- ../../../../fase-2/analytics-service/k8s/service.yaml
# hpa.yaml (min 3) removido: conflita com o ScaledObject do KEDA (min 0).
# O KEDA passa a ser o unico autoscaler -> analytics fica em 0 pod com a
# fila SQS vazia.
- ../../../../fase-2/analytics-service/k8s/kedaauthentication.yaml
- ../../../../fase-2/analytics-service/k8s/scaledobject.yaml
- externalsecret.yaml

namespace: toggle

# piso de replicas ate o KEDA reconciliar (o ScaledObject e ajustado para
# minReplicaCount: 1 no patch abaixo).
replicas:
- name: analytics-deployment
  count: 1

  # tira os valores obsoletos do configmap
  # o deployment da fase-2 so tem configMapRef -> adiciona os secretRef.
  # aws-session-creds (chaves estaticas da sessao) e criado pelo
  # null_resource.eso_aws_creds no terraform; sem IRSA/IMDS no Academy, e a
  # unica fonte de credencial AWS para o worker SQS + DynamoDB.
patches:
- patch: |
    - op: remove
      path: /data/AWS_SQS_URL
    - op: remove
      path: /data/AWS_DYNAMODB_TABLE
    - op: remove
      path: /data/AWS_REGION
  target:
    kind: ConfigMap
    name: analytics-configmap
- patch: |
    - op: add
      path: /spec/template/spec/containers/0/envFrom/-
      value:
        secretRef:
          name: analytics-secret
    - op: add
      path: /spec/template/spec/containers/0/envFrom/-
      value:
        secretRef:
          name: aws-session-creds
  target:
    kind: Deployment
    name: analytics-deployment
- patch: |
    - op: replace
      path: /spec/minReplicaCount
      value: 1
  target:
    kind: ScaledObject
    name: analytics-service-scaler

# 'name' casa com a imagem dos manifests da Fase 2 (ECR antigo). O CI atualiza
# newTag (commit SHA) via 'kustomize edit set image'.
images:
- name: 047719652987.dkr.ecr.us-east-2.amazonaws.com/tech-challenge/analytics-image
  newName: 361075236043.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/analytics-image
  newTag: 5e35bd5dce31f64b09f460cbdd95a575e9b07876
