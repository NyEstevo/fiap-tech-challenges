apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay lab. A base real vive em fase-3/analytics/k8s/base (consolidada da
# fase-2, Emenda 001), incluindo kedaauthentication.yaml e scaledobject.yaml;
# o hpa.yaml (min 3) fica de fora la mesmo -- conflita com o ScaledObject do
# KEDA (min 0), que passa a ser o unico autoscaler.
# Aqui ficam so os add-ons do lab: o ESO (analytics-secret, config derivada da
# infra que substitui AWS_SQS_URL / AWS_DYNAMODB_TABLE / AWS_REGION da conta
# antiga) e os patches (envFrom, minReplicaCount, credenciais de sessao do KEDA,
# fila/regiao do lab).
# analytics-service usa SQS + DynamoDB (schemaless) -> sem Job de migration.
resources:
- ../../../analytics/k8s/overlays/prod

namespace: toggle

# piso de replicas ate o KEDA reconciliar (o ScaledObject e ajustado para
# minReplicaCount: 1 no patch abaixo).
replicas:
- count: 1
  name: analytics-deployment

  # tira os valores obsoletos do configmap
  # o deployment da fase-2 so tem configMapRef -> adiciona os secretRef.
  # aws-session-creds (chaves estaticas da sessao) e criado pelo
  # null_resource.eso_aws_creds no terraform; sem IRSA/IMDS no Academy, e a
  # unica fonte de credencial AWS para o worker SQS + DynamoDB.
# KEDA no AWS Academy: sem IRSA, o TriggerAuthentication nao pode usar
# podIdentity. Troca por credenciais estaticas da sessao (Secret
# aws-session-creds, criado pelo null_resource.eso_aws_creds).
# scaledobject da fase-2 aponta para a fila/regiao antiga (us-east-2 /
# conta 047719652987). Aponta para a fila real do lab.
patches:
- patch: |
    - op: remove
      path: /data/AWS_SQS_URL
    - op: remove
      path: /data/AWS_DYNAMODB_TABLE
    - op: remove
      path: /data/AWS_REGION
  target:
    kind: ConfigMap
    name: analytics-configmap
- patch: |
    - op: add
      path: /spec/template/spec/containers/0/envFrom/-
      value:
        secretRef:
          name: analytics-secret
  target:
    kind: Deployment
    name: analytics-deployment
- patch: |
    - op: replace
      path: /spec/minReplicaCount
      value: 1
  target:
    kind: ScaledObject
    name: analytics-service-scaler
- patch: |
    - op: replace
      path: /spec/triggers/0/metadata/queueURL
      value: https://sqs.us-east-1.amazonaws.com/047719652987/tc-sqs-prod
    - op: replace
      path: /spec/triggers/0/metadata/awsRegion
      value: us-east-1
  target:
    group: keda.sh
    kind: ScaledObject
    name: analytics-service-scaler
    version: v1alpha1

# 'name' casa com a imagem dos manifests da Fase 2 (ECR antigo). O CI atualiza
# newTag (commit SHA) via 'kustomize edit set image'.
images:
- name: 047719652987.dkr.ecr.us-east-2.amazonaws.com/tech-challenge/analytics-image
  newName: 047719652987.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/analytics-image
  newTag: 0.0.0-lab.35-9ece630
