apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-secret
  namespace: toggle
  annotations:
    # PreSync hook: o Secret e materializado ANTES do Job de migration (que
    # tambem roda em PreSync e referencia auth-secret em envFrom). Como
    # resource normal (fase Sync) ele so seria aplicado depois do PreSync ->
    # o pod do Job travava em CreateContainerConfigError ("secret not found")
    # e bloqueava a fase PreSync inteira.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2" # antes do Job de migration (wave -1)
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: auth-secret # mesmo nome que o Deployment referencia em envFrom
    creationPolicy: Owner
    # o hook e deletado/recriado a cada sync; Retain mantem o Secret no ar
    # (o Deployment e o seed-job dependem dele).
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: tc-rds-auth-credentials
        property: url
    - secretKey: MASTER_KEY
      remoteRef:
        key: tc-auth-app
        property: MASTER_KEY
