apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay lab. A base real vive em fase-3/auth/k8s/base (consolidada da fase-2,
# Emenda 001); aqui ficam so os add-ons do lab: ESO, Job de migration dedicado
# (imagem golang-migrate propria) e o hook PostSync auth-seed-service-key
# (le SERVICE_API_KEY do evaluation-secret -- acoplamento cross-service).
# secrets.yaml da fase-2 e omitido; o Secret auth-secret e materializado pelo
# ESO a partir do AWS Secrets Manager (externalsecret.yaml + ClusterSecretStore
# em manifests/platform).
resources:
- ../../../auth/k8s/overlays/prod
- migrate-job.yaml
- seed-job.yaml

namespace: toggle

# 1 replica por servico (lab: teto de pods baixo)
replicas:
- count: 1
  name: auth-deployment

# 'name' casa com a imagem escrita nos manifests da Fase 2 (ECR antigo);
# newName/newTag apontam para o ECR desta conta. O CI atualiza newTag com
# a tag publicada (commit SHA) via 'kustomize edit set image'.
images:
- name: 047719652987.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/auth-migrate-image
  newName: 047719652987.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/auth-migrate-image
  newTag: 0.0.0-lab.35-9ece630
- name: 047719652987.dkr.ecr.us-east-2.amazonaws.com/tech-challenge/auth-image
  newName: 047719652987.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/auth-image
  newTag: 0.0.0-lab.35-9ece630
