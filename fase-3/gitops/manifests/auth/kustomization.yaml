apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reaproveita os manifests da Fase 2 sem duplicar.
# secrets.yaml e DELIBERADAMENTE omitido (credenciais commitadas em base64);
# o Secret e criado a partir do 'terraform output' do modulo rds.
resources:
- ../../../../fase-2/auth-service/k8s/configmap.yaml
- ../../../../fase-2/auth-service/k8s/deployment.yaml
- ../../../../fase-2/auth-service/k8s/service.yaml
- migrate-job.yaml

namespace: toggle

# 'name' casa com a imagem escrita nos manifests da Fase 2 (ECR antigo);
# newName/newTag apontam para o ECR desta conta. O CI atualiza newTag com
# a tag publicada (commit SHA) via 'kustomize edit set image'.
images:
- name: 047719652987.dkr.ecr.us-east-2.amazonaws.com/tech-challenge/auth-image
  newName: 361075236043.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/auth-image
  newTag: ba5ebbf58d510247bec4b7d69ae00749bea907e8
- name: 361075236043.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/auth-migrate-image
  newName: 361075236043.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/auth-migrate-image
  newTag: ba5ebbf58d510247bec4b7d69ae00749bea907e8
