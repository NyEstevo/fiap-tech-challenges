apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  namespace: toggle
  annotations:
    # roda uma vez por sync do ArgoCD, ANTES do rollout do Deployment
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: auth
        job: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        # espera o RDS aceitar conexao antes de rodar a migration
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -d "$DATABASE_URL"; do
                echo "aguardando o banco..."; sleep 2;
              done
          envFrom:
            - secretRef:
                name: auth-secret
      containers:
        - name: migrate
          # ECR tech-challenge/auth-migrate-image :: golang-migrate + migrations/
          # a tag (commit SHA) e setada pelo CI via 'kustomize edit set image'
          image: 361075236043.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/auth-migrate-image
          args:
            - "-path=/migrations"
            - "-database=$(DATABASE_URL)"
            - "up"
          envFrom:
            - secretRef:
                name: auth-secret
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
