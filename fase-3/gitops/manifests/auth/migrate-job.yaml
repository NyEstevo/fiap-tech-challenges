apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  namespace: toggle
  annotations:
    # resource normal (nao hook): waves ordenam ExternalSecret(-3) -> Job(-2)
    # -> Deployment(0). 'spec.template' do Job e imutavel: 'Replace=true'
    # sozinho roda 'kubectl replace' e falha nesse campo, deixando o Job
    # antigo preso na imagem anterior (ImagePullBackOff quando a tag some).
    # 'Force=true' -> 'kubectl replace --force' (delete + create), entao o
    # Job e recriado com a imagem nova a cada bump de tag.
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: auth
        job: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        # espera o RDS aceitar conexao antes de rodar a migration
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -d "$DATABASE_URL"; do
                echo "aguardando o banco..."; sleep 2;
              done
          envFrom:
            - secretRef:
                name: auth-secret
      containers:
        - name: migrate
          # ECR tech-challenge/auth-migrate-image :: golang-migrate + migrations/
          # a tag (commit SHA) e setada pelo CI via 'kustomize edit set image'
          image: 047719652987.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/auth-migrate-image
          args:
            - "-path=/migrations"
            - "-database=$(DATABASE_URL)"
            - "up"
          envFrom:
            - secretRef:
                name: auth-secret
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
