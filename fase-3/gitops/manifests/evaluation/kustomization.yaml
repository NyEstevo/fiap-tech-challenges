apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reaproveita os manifests da Fase 2 sem duplicar.
# secrets.yaml da fase-2 e omitido; o Secret <svc>-secret e materializado
# pelo External Secrets Operator a partir do AWS Secrets Manager
# (externalsecret.yaml + ClusterSecretStore em manifests/platform).
# evaluation-service nao tem banco relacional (so Redis) -> sem Job de migration.
resources:
  - ../../../../fase-2/evaluation-service/k8s/configmap.yaml
  - ../../../../fase-2/evaluation-service/k8s/deployment.yaml
  - ../../../../fase-2/evaluation-service/k8s/service.yaml
  - externalsecret.yaml
  - ../../../../fase-2/evaluation-service/k8s/hpa.yaml

namespace: toggle

# O configmap da fase-2 traz REDIS_URL / AWS_SQS_URL / AWS_REGION apontando
# para a conta e regiao da fase-2 (us-east-2). Esses valores agora vem do
# Secrets Manager via evaluation-secret; removidos do configmap para nao
# ficar valor obsoleto conflitante.
patches:
  - target:
      kind: ConfigMap
      name: evaluation-configmap
    patch: |
      - op: remove
        path: /data/REDIS_URL
      - op: remove
        path: /data/AWS_SQS_URL
      - op: remove
        path: /data/AWS_REGION
  # aws-session-creds (chaves estaticas da sessao) e criado pelo
  # null_resource.eso_aws_creds no terraform; sem IRSA/IMDS no Academy, e a
  # unica fonte de credencial AWS para o publish no SQS.
  - target:
      kind: Deployment
      name: evaluation-deployment
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: aws-session-creds

# 'name' casa com a imagem dos manifests da Fase 2 (ECR antigo). O CI atualiza
# newTag (commit SHA) via 'kustomize edit set image'.
images:
- name: 047719652987.dkr.ecr.us-east-2.amazonaws.com/tech-challenge/evaluation-image
  newName: 361075236043.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/evaluation-image
  newTag: 8750fe531b1d8fb20d9504d6d57f9bec5c75ce69
