apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay lab. A base real vive em fase-3/evaluation/k8s/base (consolidada da
# fase-2, Emenda 001), incluindo o hpa.yaml; aqui ficam so os add-ons do lab:
# ESO e os patches (configmap sem valores da conta antiga, secretRef de sessao
# AWS, HPA 1..3). secrets.yaml da fase-2 e omitido; o Secret evaluation-secret
# e materializado pelo ESO a partir do AWS Secrets Manager (externalsecret.yaml
# + ClusterSecretStore em manifests/platform).
# evaluation-service nao tem banco relacional (so Redis) -> sem Job de migration.
resources:
- ../../../evaluation/k8s/overlays/prod

namespace: toggle

# 1 replica; HPA 1..3.
replicas:
- count: 1
  name: evaluation-deployment

# O configmap da fase-2 traz REDIS_URL / AWS_SQS_URL / AWS_REGION apontando
# para a conta e regiao da fase-2 (us-east-2). Esses valores agora vem do
# Secrets Manager via evaluation-secret; removidos do configmap para nao
# ficar valor obsoleto conflitante.
  # aws-session-creds (chaves estaticas da sessao) e criado pelo
  # null_resource.eso_aws_creds no terraform; sem IRSA/IMDS no Academy, e a
  # unica fonte de credencial AWS para o publish no SQS.
patches:
- patch: |
    - op: remove
      path: /data/REDIS_URL
    - op: remove
      path: /data/AWS_SQS_URL
    - op: remove
      path: /data/AWS_REGION
  target:
    kind: ConfigMap
    name: evaluation-configmap
- patch: |
    - op: replace
      path: /spec/minReplicas
      value: 1
    - op: replace
      path: /spec/maxReplicas
      value: 3
  target:
    kind: HorizontalPodAutoscaler
    name: evaluation-hpa

# 'name' casa com a imagem dos manifests da Fase 2 (ECR antigo). O CI atualiza
# newTag (commit SHA) via 'kustomize edit set image'.
images:
- name: 047719652987.dkr.ecr.us-east-2.amazonaws.com/tech-challenge/evaluation-image
  newName: 047719652987.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/evaluation-image
  newTag: 0.0.0-lab.35-9ece630
