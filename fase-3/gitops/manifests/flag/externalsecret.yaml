apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flag-secret
  namespace: toggle
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # cria o Secret antes do Deployment / Job
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: flag-secret # mesmo nome que o Deployment referencia em envFrom
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: tc-rds-flag-credentials
        property: url
