apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # Sem IRSA (Academy) e o IMDS do node nao e alcancavel do pod do ESO
      # -> a cadeia padrao do SDK nao acha credencial (NoCredentialProviders).
      # Usa as chaves estaticas da sessao, no Secret aws-static-creds, criado
      # pelo null_resource.eso_aws_creds no terraform apply (expira ~4h; e
      # recriado a cada apply).
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-static-creds
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-static-creds
            namespace: external-secrets
            key: secret-access-key
          sessionTokenSecretRef:
            name: aws-static-creds
            namespace: external-secrets
            key: session-token
