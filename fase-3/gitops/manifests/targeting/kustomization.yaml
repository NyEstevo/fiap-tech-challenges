apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reaproveita os manifests da Fase 2 sem duplicar.
# secrets.yaml e DELIBERADAMENTE omitido (credenciais commitadas em base64);
# o Secret e criado a partir do 'terraform output' do modulo rds.
resources:
  - ../../../../fase-2/targeting-service/k8s/configmap.yaml
  - ../../../../fase-2/targeting-service/k8s/deployment.yaml
  - ../../../../fase-2/targeting-service/k8s/service.yaml
  - migrate-job.yaml

namespace: toggle

# 'name' casa com a imagem dos manifests da Fase 2 (ECR antigo). A mesma
# entrada reescreve o Deployment e o Job de migration. O CI atualiza newTag
# (commit SHA) via 'kustomize edit set image'.
images:
  - name: 047719652987.dkr.ecr.us-east-2.amazonaws.com/tech-challenge/targeting-image
    newName: 361075236043.dkr.ecr.us-east-1.amazonaws.com/tech-challenge/targeting-image
    newTag: "1.0"
