apiVersion: batch/v1
kind: Job
metadata:
  name: targeting-migrate
  namespace: toggle
  annotations:
    # roda uma vez por sync do ArgoCD, ANTES do rollout do Deployment
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1" # depois do ExternalSecret (hook PreSync wave -2)
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: targeting
        job: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -d "$DATABASE_URL"; do
                echo "aguardando o banco..."; sleep 2;
              done
          envFrom:
            - secretRef:
                name: targeting-secret
      containers:
        - name: migrate
          # mesma imagem da aplicacao (Alembic + alembic/ ja embarcados);
          # o CI reescreve name+tag via 'kustomize edit set image'
          image: 047719652987.dkr.ecr.us-east-2.amazonaws.com/tech-challenge/targeting-image
          command: ["alembic", "upgrade", "head"]
          workingDir: /app
          envFrom:
            - secretRef:
                name: targeting-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "50m"
