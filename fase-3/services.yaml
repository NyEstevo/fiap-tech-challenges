# fase-3/services.yaml
# Fonte unica de verdade dos microsservicos do Toggle Master (fase-3).
#
# Regra: aqui entra SO o que varia entre os 5 servicos. O que e igual aos 5
# (namespace 'toggle', Service ClusterIP, probes /health, envFrom padrao,
# securityContext runAsNonRoot:1000, strategy RollingUpdate, ExternalSecret +
# ClusterSecretStore, Application/overlay do ArgoCD, passo de bump de imagem no
# CI, registry ECR de destino) pertence a base/template, nao a este arquivo.
# Nada de bloco por ambiente: a diferenca entre local/lab/prod e configuracao,
# nao estrutura.
#
# Adicionar um servico = adicionar um item nesta lista e nada mais.
#
# ---------------------------------------------------------------------------
# Sobre o schema
#
# O schema minimo pedido no contrato e:
#   name, language, port, path, http{enabled,route}, queue{enabled,name},
#   dynamodb{enabled,table}, db{enabled}
#
# Este arquivo carrega 6 campos ALEM dessa lista. Todos VARIAM entre os 5 e
# todos sao lidos hoje por Terraform, Actions ou ArgoCD -- sem eles a fonte
# unica nao consegue gerar os tres consumidores sozinha:
#
#   db.name         nome do banco inicial da instancia RDS. NAO e derivavel de
#                   'name': flag usa 'flags_db', nao 'flag_db'. db_name e
#                   ForceNew no aws_db_instance -- derivar errado SUBSTITUI a
#                   instancia. Lido por infra/terraform/modules/service.
#   cache.enabled   so evaluation (ElastiCache Redis; REDIS_URL vem do ESO)
#   db.seed         so auth (Job PostSync auth-seed-service-key)
#   db.migrate      so auth e 'dedicated' (imagem golang-migrate propria);
#                   flags/targeting sao 'app' (Alembic da imagem da aplicacao).
#                   E o que o CI le hoje como 'has_migrate_image'.
#   queue.mode      evaluation e producer, analytics e consumer
#   queue.keda      so analytics tem ScaledObject por profundidade de fila SQS
#
# Cortar qualquer um deles nao simplifica o schema: move a variacao para dentro
# do template, que e exatamente o que o contrato proibe.
# ---------------------------------------------------------------------------

services:
  - name: auth
    language: go
    port: 8001
    path: fase-2/auth-service
    http:     { enabled: true,  route: /auth }
    db:       { enabled: true,  name: auth_db,      seed: true,  migrate: dedicated }
    cache:    { enabled: false }
    queue:    { enabled: false }
    dynamodb: { enabled: false }

  - name: flags
    language: python
    port: 8002
    path: fase-2/flags-service
    http:     { enabled: true,  route: /flags }
    db:       { enabled: true,  name: flags_db,     seed: false, migrate: app }
    cache:    { enabled: false }
    queue:    { enabled: false }
    dynamodb: { enabled: false }

  - name: targeting
    language: python
    port: 8003
    path: fase-2/targeting-service
    http:     { enabled: true,  route: /targeting }
    db:       { enabled: true,  name: targeting_db, seed: false, migrate: app }
    cache:    { enabled: false }
    queue:    { enabled: false }
    dynamodb: { enabled: false }

  - name: evaluation
    language: go
    port: 8004
    path: fase-2/evaluation-service
    http:     { enabled: true,  route: /evaluation }
    db:       { enabled: false }
    cache:    { enabled: true }
    queue:    { enabled: true,  name: tc-sqs, mode: producer, keda: false }
    dynamodb: { enabled: false }

  - name: analytics
    language: python
    port: 8005
    path: fase-2/analytics-service
    http:     { enabled: true,  route: /analytics }
    db:       { enabled: false }
    cache:    { enabled: false }
    queue:    { enabled: true,  name: tc-sqs, mode: consumer, keda: true }
    dynamodb: { enabled: true,  table: tc-dynamo }

