apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: targeting-secret
  namespace: toggle
  annotations:
    # resource normal (nao hook): a wave -3 aplica o ExternalSecret antes do
    # Job de migration (wave -2) e do Deployment (wave 0). Nao e hook -> o
    # ArgoCD nao deleta/recria a cada sync (era o que fazia o ESO ficar em
    # loop "in deletion" <-> "reconciled" e travava a fase PreSync).
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: targeting-secret # mesmo nome que o Deployment referencia em envFrom
    creationPolicy: Owner
    # Retain: se o recurso for pruned, o Secret continua no ar.
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: tc-rds-targeting-credentials
        property: url
