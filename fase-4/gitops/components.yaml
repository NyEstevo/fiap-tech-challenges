# fase-4/gitops/components.yaml
# Fonte unica da stack de observabilidade. Cada item = uma Application gerada
# por fase-4/gitops/applicationset.yaml.
#
# Chaves (todas obrigatorias; use "" quando nao se aplica):
#   name       nome da Application e do release Helm. NAO pode colidir com as
#              Applications da fase-3 (auth-service ... platform, ingress).
#   namespace  namespace de destino
#   type       manifests | helm
#   sourcePath (manifests) diretorio Kustomize neste repo. Nao e `path`: o
#              generator injeta um `path` proprio que sobrescreveria este.
#   repoURL    (helm) repositorio do chart
#   chart      (helm) nome do chart
#   version    (helm) versao fixa do chart -- nunca range
#
# A lista nunca fica vazia: o generator transforma arquivo vazio em um item
# sem chaves, e o template falha com missingkey=error.

- name: observability
  namespace: observability
  type: manifests
  sourcePath: fase-4/gitops/manifests/observability
  repoURL: ""
  chart: ""
  version: ""

# Prometheus + Grafana + kube-state-metrics + node-exporter (+ operator).
# Alertmanager desligado: alertas vao pelo Grafana (fatia 9).
- name: kube-prometheus-stack
  namespace: observability
  type: helm
  sourcePath: ""
  repoURL: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  version: 92.10.1

# Logs centralizados de todos os containers (chegam via OTel Collector).
- name: loki
  namespace: observability
  type: helm
  sourcePath: ""
  repoURL: https://grafana.github.io/helm-charts
  chart: loki
  version: 7.3.0

# OTel Collector (DaemonSet): recebe OTLP dos servicos + logs dos containers
# e roteia para Prometheus, Loki e (fatia 7) Datadog.
- name: otel-collector
  namespace: observability
  type: helm
  sourcePath: ""
  repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
  chart: opentelemetry-collector
  version: 0.176.0
