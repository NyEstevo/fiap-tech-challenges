# Chaves dos canais de alerta (PagerDuty, Slack, GitHub), lidas do AWS Secrets
# Manager pelo ESO. Nada disso fica no git.
#
# Secret remoto esperado (us-east-1), criado a mao uma vez por sessao do lab:
#   tc-observability = {"PAGERDUTY_ROUTING_KEY": "...",
#                       "SLACK_WEBHOOK_URL": "...",
#                       "GITHUB_DISPATCH_TOKEN": "...", ...}
#
# So as 3 chaves de alerta entram aqui (a chave do Datadog e de outro
# consumidor). Os nomes ja saem em MAIUSCULO porque o Grafana recebe este
# Secret inteiro como variaveis de ambiente (grafana.envFromSecrets) e os
# arquivos de alerting referenciam ${PAGERDUTY_ROUTING_KEY} etc.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-alerting
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-alerting
    creationPolicy: Owner
  data:
    - secretKey: PAGERDUTY_ROUTING_KEY
      remoteRef:
        key: tc-observability
        property: PAGERDUTY_ROUTING_KEY
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: tc-observability
        property: SLACK_WEBHOOK_URL
    - secretKey: GITHUB_DISPATCH_TOKEN
      remoteRef:
        key: tc-observability
        property: GITHUB_DISPATCH_TOKEN
