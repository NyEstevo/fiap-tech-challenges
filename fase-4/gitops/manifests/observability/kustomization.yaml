apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base da stack de observabilidade: o que nao vem de chart Helm. Aqui ficam:
# - ExternalSecrets para ler credenciais do AWS Secrets Manager
# - ConfigMaps de regras de alerta e contact points do Grafana Unified Alerting
# - Dashboard customizado
resources:
- namespace.yaml
- grafana-admin.yaml
- externalsecret.yaml
- grafana-alerts-config.yaml
- grafana-contact-points-config.yaml
