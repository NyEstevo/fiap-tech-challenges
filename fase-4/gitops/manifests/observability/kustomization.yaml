apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base da stack de observabilidade: o que nao vem de chart Helm (senha do
# Grafana, chaves externas via ESO, alerting do Grafana como codigo).
# Uma lista so: com duas chaves 'resources:' o YAML fica com a ultima e as
# outras somem do render sem erro nenhum.
resources:
- namespace.yaml
- grafana-admin.yaml
- datadog-keys.yaml
- alerting-secrets.yaml
- alerting.yaml

# Dashboards como codigo. O sidecar do Grafana (kube-prometheus-stack) carrega
# todo ConfigMap com o label grafana_dashboard: "1", de qualquer namespace.
# Para alterar: edite no Grafana, exporte o JSON (Share -> Export) e substitua
# o arquivo -- alteracoes feitas so na UI somem no proximo restart do pod.
configMapGenerator:
- name: grafana-dashboard-togglemaster
  namespace: observability
  files:
  - dashboards/togglemaster-saude.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
