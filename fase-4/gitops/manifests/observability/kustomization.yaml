apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base da stack de observabilidade: o que nao vem de chart Helm. Nas proximas
# fatias entram aqui os ExternalSecrets (Datadog, PagerDuty, Slack, GitHub)
# e as regras de alerta do Grafana.
resources:
- namespace.yaml
- grafana-admin.yaml

# Dashboards como codigo. O sidecar do Grafana (kube-prometheus-stack) carrega
# todo ConfigMap com o label grafana_dashboard: "1", de qualquer namespace.
# Para alterar: edite no Grafana, exporte o JSON (Share -> Export) e substitua
# o arquivo -- alteracoes feitas so na UI somem no proximo restart do pod.
configMapGenerator:
- name: grafana-dashboard-togglemaster
  namespace: observability
  files:
  - dashboards/togglemaster-saude.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
