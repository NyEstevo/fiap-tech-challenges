# fase-4/gitops/values/otel-collector.yaml
# Chart open-telemetry/opentelemetry-collector (versao em components.yaml).
#
# A "central dos Correios" da observabilidade: os servicos mandam TUDO
# (metricas, logs, traces) por OTLP para o Collector do proprio no, e ele
# roteia cada sinal para o backend certo:
#
#   metricas  -> Prometheus  (receptor OTLP nativo, /api/v1/otlp)
#   logs      -> Loki        (receptor OTLP nativo, /otlp)
#   traces    -> Datadog APM (exporter datadog; connector datadog gera metricas)
#
# DaemonSet (1 pod por no): le os logs de todos os containers do no direto
# de /var/log/pods (`filelog`, substitui o Promtail descontinuado) e recebe
# OTLP pela hostPort -- os servicos apontam para o IP do proprio no
# (status.hostIP), sem atravessar a rede para outro no.
mode: daemonset

# Variaveis de ambiente: DD_API_KEY e DD_SITE vem do Secret "datadog-keys"
# (criado pelo ExternalSecret). O Collector as substitui na config via ${env:...}.
extraEnvs:
  - name: DD_API_KEY
    valueFrom:
      secretKeyRef:
        name: datadog-keys
        key: DD_API_KEY
  - name: DD_SITE
    valueFrom:
      secretKeyRef:
        name: datadog-keys
        key: DD_SITE

# contrib: traz os componentes que o core nao tem (k8sattributes, filelog e,
# na fatia 7, o exporter/connector do Datadog).
image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib

presets:
  # Receiver filelog sobre /var/log/pods (+ parser do formato do containerd)
  # e os volumes hostPath para le-lo. Logs do proprio Collector ficam de fora
  # para nao virar loop (o Collector logando que leu o proprio log).
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  # Processor k8sattributes + RBAC para consultar a API: anexa namespace,
  # deployment, pod e no a cada metrica/log/trace.
  kubernetesAttributes:
    enabled: true

# Jaeger e Zipkin nao sao usados: os servicos falam OTLP.
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  receivers:
    jaeger: null
    zipkin: null

  processors:
    # Mesmo se o servico nao informar, todo sinal sai com o cluster e o
    # ambiente (diferenca entre ambientes e configuracao, nao codigo).
    resource:
      attributes:
        - key: k8s.cluster.name
          value: tc-eks
          action: upsert
        - key: deployment.environment
          value: lab
          action: insert

  exporters:
    # Prometheus 3: otlphttp acrescenta /v1/metrics ao endpoint.
    otlphttp/prometheus:
      endpoint: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/otlp
      tls:
        insecure: true
    # Loki 3: otlphttp acrescenta /v1/logs ao endpoint.
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
      tls:
        insecure: true
    # Datadog APM: traces enviados ao Datadog para Service Map e visualizacao
    # de traces distribuidos. O exporter usa DD_API_KEY e DD_SITE do ambiente.
    datadog:
      api:
        key: ${env:DD_API_KEY}
        site: ${env:DD_SITE}
      # Tags globais para o host no Datadog. Os servicos ja informam service.name,
      # e o k8sattributes processor adiciona deployment, namespace, pod, etc.
      host_metadata:
        tags:
          - env:lab

  # Connector: transforma traces em metricas para Datadog APM (Service Map).
  # O Datadog connector le os traces e computa: hits, errors, duration por
  # servico. Essas metricas alimentam a page de APM, grafico de dependencias
  # (Service Map) e alertas de SLO.
  connectors:
    datadog/traces: {}

  service:
    pipelines:
      # Ordem dos processors: memory_limiter primeiro (protege antes de
      # gastar memoria), batch por ultimo (agrupa o que ja foi enriquecido).
      # Nota: o connector datadog/traces é um receiver que gera metricas a
      # partir dos traces, então é incluído aqui.
      metrics:
        receivers: [otlp, prometheus, datadog/traces]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlphttp/prometheus]
      logs:
        receivers: [otlp, filelog]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlphttp/loki]
      # Traces para Datadog APM: passa pelo connector datadog/traces para
      # gerar metricas (hits, errors, latencia por servico), que alimentam
      # o APM/Service Map. Os traces sao exportados ao Datadog direto.
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [datadog, datadog/traces]

# memory_limiter usa limit_percentage (80% do limit abaixo); GOMEMLIMIT
# (useGOMEMLIMIT, default true) acompanha o mesmo limit.
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 384Mi }
