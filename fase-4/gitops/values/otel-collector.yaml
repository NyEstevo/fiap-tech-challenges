# fase-4/gitops/values/otel-collector.yaml
# Chart open-telemetry/opentelemetry-collector (versao em components.yaml).
#
# A "central dos Correios" da observabilidade: os servicos mandam TUDO
# (metricas, logs, traces) por OTLP para o Collector do proprio no, e ele
# roteia cada sinal para o backend certo:
#
#   metricas  -> Prometheus  (receptor OTLP nativo, /api/v1/otlp)
#   logs      -> Loki        (receptor OTLP nativo, /otlp)
#   traces    -> Datadog APM (exporter datadog; connector datadog gera metricas)
#
# DaemonSet (1 pod por no): le os logs de todos os containers do no direto
# de /var/log/pods (`filelog`, substitui o Promtail descontinuado) e recebe
# OTLP pela hostPort -- os servicos apontam para o IP do proprio no
# (status.hostIP), sem atravessar a rede para outro no.
mode: daemonset

# DD_API_KEY e DD_SITE vem do Secret "datadog-keys" (ExternalSecret em
# manifests/observability/datadog-keys.yaml). optional + valor padrao na config
# (${env:DD_API_KEY:-sem-chave}): sem o secret no Secrets Manager o Collector
# SOBE do mesmo jeito -- so o envio ao Datadog falha (erro no log), e metricas
# e logs para Prometheus/Loki seguem funcionando. Sem isso, faltar a chave
# derrubaria a observabilidade inteira.
extraEnvs:
  - name: DD_API_KEY
    valueFrom:
      secretKeyRef:
        name: datadog-keys
        key: DD_API_KEY
        optional: true
  - name: DD_SITE
    valueFrom:
      secretKeyRef:
        name: datadog-keys
        key: DD_SITE
        optional: true

# contrib: traz os componentes que o core nao tem (k8sattributes, filelog e,
# na fatia 7, o exporter/connector do Datadog).
image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib

presets:
  # Receiver filelog sobre /var/log/pods (+ parser do formato do containerd)
  # e os volumes hostPath para le-lo. Logs do proprio Collector ficam de fora
  # para nao virar loop (o Collector logando que leu o proprio log).
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  # Processor k8sattributes + RBAC para consultar a API: anexa namespace,
  # deployment, pod e no a cada metrica/log/trace.
  kubernetesAttributes:
    enabled: true

# Jaeger e Zipkin nao sao usados: os servicos falam OTLP.
ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  receivers:
    jaeger: null
    zipkin: null

  processors:
    # Mesmo se o servico nao informar, todo sinal sai com o cluster e o
    # ambiente (diferenca entre ambientes e configuracao, nao codigo).
    resource:
      attributes:
        - key: k8s.cluster.name
          value: tc-eks
          action: upsert
        - key: deployment.environment
          value: lab
          action: insert

  exporters:
    # Prometheus 3: otlphttp acrescenta /v1/metrics ao endpoint.
    otlphttp/prometheus:
      endpoint: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/otlp
      tls:
        insecure: true
    # Loki 3: otlphttp acrescenta /v1/logs ao endpoint.
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
      tls:
        insecure: true
    # Datadog APM (sem Datadog Agent): recebe os traces e as estatisticas de
    # APM calculadas pelo connector abaixo. service.name vira o "service" e
    # deployment.environment (processor resource) vira o "env:lab".
    datadog:
      api:
        key: ${env:DD_API_KEY:-sem-chave}
        site: ${env:DD_SITE:-datadoghq.com}
      host_metadata:
        tags:
          - env:lab

  # Connector datadog: le os traces (ponta de saida do pipeline traces) e
  # calcula hits, erros e latencia por servico/recurso -- as "APM stats" que
  # desenham a Service Page e o Service Map. Elas saem como metricas em um
  # pipeline proprio que vai SO para o Datadog (sao especificas dele; no
  # Prometheus seriam lixo).
  connectors:
    datadog/connector: {}

  service:
    pipelines:
      # Ordem dos processors: memory_limiter primeiro (protege antes de
      # gastar memoria), batch por ultimo (agrupa o que ja foi enriquecido).
      metrics:
        receivers: [otlp, prometheus]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlphttp/prometheus]
      logs:
        receivers: [otlp, filelog]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [otlphttp/loki]
      # Traces: vao ao Datadog e, em paralelo, ao connector que calcula as
      # APM stats; estas voltam como metricas no pipeline metrics/datadog.
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [datadog, datadog/connector]
      metrics/datadog:
        receivers: [datadog/connector]
        processors: [memory_limiter, batch]
        exporters: [datadog]

# memory_limiter usa limit_percentage (80% do limit abaixo); GOMEMLIMIT
# (useGOMEMLIMIT, default true) acompanha o mesmo limit.
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 384Mi }
